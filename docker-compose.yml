version: '3.9'

services:
    users-service:
        image: kovryzhko-clinic/users-service
        container_name: users-service
        build:
            context: ./
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - .env.production.local
        networks:
            - kovryzhko-clinic

networks:
    kovryzhko-clinic:
        external: true
